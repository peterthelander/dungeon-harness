<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Harness Engine</title>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Upload Initialization Layer -->
    <div id="upload-overlay" style="display: none;">
        <div class="upload-container">
            <h1>Dungeon Harness</h1>
            <p style="margin-bottom: 20px; color: #aaa;">Choose a pre-selected adventure or upload a PDF module.</p>
            
            <div class="preset-modules">
                <button class="preset-btn" onclick="loadUrl('https://trilemma.com/blog/adventures/24%20Sky-Blind%20Spire.pdf')">
                    <strong>The Sky Blind Spire</strong><br>by Michael Prescott
                </button>
                <button class="preset-btn" onclick="loadUrl('https://friendorfoe.com/d/Tomb%20of%20the%20Serpent_Kings%20v4.pdf')">
                    <strong>Tomb of the Serpent Kings</strong><br>by Skerples
                </button>
                <button class="preset-btn" onclick="loadUrl('https://uberty.org/wp-content/uploads/2015/12/herman-melville-moby-dick.pdf')">
                    <strong>Moby Dick</strong><br>by Herman Melville
                </button>
                <button class="preset-btn" onclick="loadUrl('https://www.bramstoker.org/pdf/novels/05dracula.pdf')">
                    <strong>Dracula</strong><br>by Bram Stoker
                </button>
            </div>
            
            <hr style="margin: 20px 0; border-color: #333 border-style: solid; border-width: 1px 0 0 0;" />
            <p style="margin-bottom: 15px; color: #aaa;">Or upload your own:</p>
            <input type="file" id="pdf-upload" accept="application/pdf" />
            <button class="primary" id="init-engine-btn" onclick="initializeEngine()">Begin Quest</button>
            <div id="loading-text">Preparing your adventure...</div>
        </div>
    </div>

    <!-- Main Game Dashboard -->
    <div id="dashboard">
        <header class="app-header">
            <div class="app-header__title">
                <span class="app-header__logo">DH</span>
                <span class="app-header__text">Dungeon Harness</span>
            </div>
            <div class="app-header__menu-container">
                <button type="button" id="menu-toggle-btn" class="menu-toggle-btn" aria-label="Game Menu" title="Game Menu" onclick="toggleAppMenu(event)">
                    &#8942;
                </button>
                <div id="app-menu-dropdown" class="app-menu-dropdown" style="display: none;">
                    <button type="button" class="app-menu-item" onclick="submitPromptMenuItem('New adventure')">New adventure</button>
                    <button type="button" class="app-menu-item" onclick="submitPromptMenuItem('Character')">Character</button>
                    <button type="button" class="app-menu-item" onclick="submitPromptMenuItem('Inventory')">Inventory</button>
                    <button type="button" class="app-menu-item" onclick="submitPromptMenuItem('Journal')">Journal</button>
                    <button type="button" class="app-menu-item" onclick="submitPromptMenuItem('Recap')">Recap</button>
                    <button type="button" class="app-menu-item" onclick="submitPromptMenuItem('What can I do?')">What can I do?</button>
                </div>
            </div>
        </header>
        <main id="scene-page-root" aria-label="Current scene"></main>
    </div>

    <!-- Engine Scripts -->
    <script src="script.js"></script>
</body>
</html>
