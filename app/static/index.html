<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#1e1e1e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Dungeon Harness">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Dungeon Harness</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="welcome.css">
    <link rel="stylesheet" href="welcome-art.css">
    <link rel="stylesheet" href="discover.css">
</head>
<body>
    <div id="upload-overlay" style="display: none;" aria-hidden="true">
        <input type="file" id="pdf-upload" accept="application/pdf" tabindex="-1" />
        <button class="primary" id="init-engine-btn" type="button" onclick="initializeEngine()">Begin Quest</button>
        <div id="loading-text">Preparing your adventure...</div>
    </div>
    <div id="dashboard">
        <main id="scene-page-root" aria-label="Current scene"></main>
    </div>
    <script src="script.js"></script>
    <script src="welcome-art.js"></script>
    <script src="discover.js"></script>
    <script src="welcome.js"></script>
</body>
</html>
