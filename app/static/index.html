<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Harness Engine</title>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Upload Initialization Layer -->
    <div id="upload-overlay">
        <div class="upload-container">
            <h1>Dungeon Harness</h1>
            <p style="margin-bottom: 20px; color: #aaa;">Choose a pre-selected adventure or upload a PDF module.</p>
            
            <div class="preset-modules">
                <button class="preset-btn" onclick="loadUrl('https://trilemma.com/blog/adventures/24%20Sky-Blind%20Spire.pdf')">
                    <strong>The Sky Blind Spire</strong><br>by Michael Prescott
                </button>
                <button class="preset-btn" onclick="loadUrl('https://friendorfoe.com/d/Tomb%20of%20the%20Serpent_Kings%20v4.pdf')">
                    <strong>Tomb of the Serpent Kings</strong><br>by Skerples
                </button>
                <button class="preset-btn" onclick="loadUrl('https://uberty.org/wp-content/uploads/2015/12/herman-melville-moby-dick.pdf')">
                    <strong>Moby Dick</strong><br>by Herman Melville
                </button>
                <button class="preset-btn" onclick="loadUrl('https://www.bramstoker.org/pdf/novels/05dracula.pdf')">
                    <strong>Dracula</strong><br>by Bram Stoker
                </button>
                <button class="preset-btn" onclick="loadUrl('https://www.gutenberg.org/cache/epub/1251/pg1251.txt')">
                    <strong>Le Morte D'Arthur</strong><br>by Sir Thomas Malory
                </button>
            </div>
            
            <hr style="margin: 20px 0; border-color: #333 border-style: solid; border-width: 1px 0 0 0;" />
            <p style="margin-bottom: 15px; color: #aaa;">Or upload your own:</p>
            <input type="file" id="pdf-upload" accept="application/pdf" />
            <button class="primary" id="init-engine-btn" onclick="initializeEngine()">Begin Quest</button>
            <div id="loading-text">Preparing your adventure...</div>
        </div>
    </div>

    <!-- Main Game Dashboard -->
    <div id="dashboard">
        <!-- Visual Horizon (Left) -->
        <div id="image-canvas-container">
            <span class="placeholder-text" id="canvas-placeholder">Scene visualizations will appear here...</span>
            <img id="image-canvas" src="" alt="Thumbnail Scene" style="display: none;" />
        </div>

        <!-- Chat Interface (Right) -->
        <div id="right-panel">
            <!-- Chat History -->
            <div id="chat-window">
                <!-- Initial DM message will be dynamically injected here upon upload -->
            </div>

            <!-- Action Input -->
            <div id="input-footer">
                <input type="text" id="action-input" placeholder="What do you do...?" onkeypress="handleKeyPress(event)" />
                <button id="send-action-btn" onclick="sendAction()">Send</button>
            </div>
        </div>
    </div>

    <!-- Engine Scripts -->
    <script src="script.js"></script>
</body>
</html>
