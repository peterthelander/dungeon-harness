<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a0a0a"/>
      <stop offset="100%" stop-color="#0a0000"/>
    </radialGradient>
    <linearGradient id="fire" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#800000"/>
      <stop offset="40%" stop-color="#e62e00"/>
      <stop offset="80%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#ffea00"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffea7a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa7c11"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="app-clip">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="80" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.3"/>

  <g clip-path="url(#app-clip)">
    <!-- Smooth Teardrop Flame -->
    <g filter="url(#glow)">
      <!-- Outer Flame -->
      <path d="M 256 40 C 220 140, 140 180, 140 270 C 140 336, 192 390, 256 390 C 320 390, 372 336, 372 270 C 372 180, 292 140, 256 40 Z" fill="url(#fire)"/>
      
      <!-- Inner Core Highlight -->
      <path d="M 256 120 C 240 180, 180 210, 180 280 C 180 322, 210 360, 256 360 C 302 360, 332 322, 332 280 C 332 210, 272 180, 256 120 Z" fill="#ffdd00" opacity="0.9"/>
    </g>

    <!-- The Ground -->
    <path d="M 0 380 L 80 395 L 160 375 L 256 400 L 350 380 L 440 395 L 512 375 L 512 512 L 0 512 Z" fill="#150800"/>
    <path d="M 0 380 L 80 395 L 160 375 L 256 400 L 350 380 L 440 395 L 512 375" fill="none" stroke="#ff5500" stroke-width="6" filter="url(#glow)" opacity="0.8"/>
    
    <!-- Text under ground -->
    <text x="256" y="465" text-anchor="middle" font-family="'Palatino Linotype', 'Book Antiqua', Georgia, serif" font-size="42" font-weight="bold" letter-spacing="1" fill="url(#gold)">DUNGEON HARNESS</text>
  </g>
</svg>
